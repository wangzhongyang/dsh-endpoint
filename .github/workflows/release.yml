name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test
      # Trusted publishing: `npm trust github dsh-endpoint --file release.yml
      # --repo wangzhongyang/dsh-endpoint --allow-publish` once; no token is
      # needed after that. Fallback: add an NPM_TOKEN secret and the env block.
      # The guard makes re-tagging an already published version a no-op.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-endpoint@$VERSION" version >/dev/null 2>&1; then
            echo "dsh-endpoint@$VERSION is already published; nothing to do"
            exit 0
          fi
          npm publish --provenance --access public
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
